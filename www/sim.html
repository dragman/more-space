<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sim Log • More Space</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: #070c18;
        --panel: #0f1528;
        --text: #e8ecff;
        --muted: #92a6cb;
        --accent: #5ed0ff;
        --accent-2: #f4c97a;
        --line: rgba(94, 208, 255, 0.28);
        --shadow: 0 14px 40px rgba(0, 0, 0, 0.42);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        font-family: "Space Grotesk", "Segoe UI", system-ui, -apple-system, sans-serif;
        background: radial-gradient(circle at 20% 15%, rgba(94, 208, 255, 0.08), transparent 48%),
          radial-gradient(circle at 80% 10%, rgba(244, 201, 122, 0.08), transparent 45%),
          radial-gradient(circle at 40% 75%, rgba(116, 169, 255, 0.1), transparent 50%),
          var(--bg);
        color: var(--text);
        overflow: hidden;
      }
      #app {
        height: 100dvh;
        width: 100vw;
        display: flex;
        flex-direction: column;
        padding: 12px 14px;
      }
      h1 {
        margin: 0 0 6px 0;
        letter-spacing: 0.04em;
        font-size: 18px;
        line-height: 1.1;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
      }
      .controls {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }
      .controls-left {
        justify-content: flex-start;
      }
      input[type="text"],
      input[type="number"],
      select {
        background: #0c1225;
        color: var(--text);
        border: 1px solid rgba(255, 255, 255, 0.12);
        padding: 7px 9px;
        border-radius: 10px;
        min-width: 160px;
        font-size: 13px;
      }
      button {
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        border: none;
        color: #0b111f;
        padding: 8px 12px;
        border-radius: 10px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: var(--shadow);
        font-size: 13px;
      }
      button.secondary {
        background: transparent;
        color: var(--text);
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: none;
      }
      button.active {
        background: linear-gradient(135deg, #f4c97a, #f2976a);
      }
      .layout {
        flex: 1 1 auto;
        min-height: 0;
        position: relative;
      }
      .panel {
        background: linear-gradient(160deg, rgba(7, 11, 22, 0.92), rgba(12, 17, 31, 0.96));
        border-radius: 14px;
        padding: 12px;
        box-shadow: var(--shadow);
        min-height: 0;
        overflow: hidden;
      }
      .log {
        display: flex;
        flex-direction: column;
        gap: 12px;
        height: 100%;
        overflow: hidden;
      }
      .log-list {
        flex: 1 1 auto;
        overflow-y: auto;
        padding-right: 6px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .log-entry {
        border: 1px solid rgba(255, 255, 255, 0.06);
        background: rgba(10, 16, 30, 0.75);
        padding: 10px 12px;
        border-radius: 12px;
      }
      .log-entry h3 {
        margin: 0 0 6px 0;
        font-size: 14px;
        letter-spacing: 0.04em;
      }
      .event {
        font-size: 12px;
        color: var(--muted);
        margin: 4px 0;
      }
      .tag {
        display: inline-block;
        background: rgba(94, 208, 255, 0.18);
        color: var(--accent);
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 700;
        margin-right: 6px;
      }
      .summary {
        display: flex;
        flex-direction: column;
        gap: 12px;
        max-height: 100%;
        overflow: hidden;
      }
      .summary-section {
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 12px;
        padding: 10px 12px;
        background: rgba(10, 16, 30, 0.7);
      }
      .grid-panel {
        position: relative;
        display: flex;
        flex-direction: column;
        min-height: 0;
        height: 100%;
      }
      .grid-controls {
        position: absolute;
        left: 50%;
        bottom: 10px;
        transform: translateX(-50%);
        z-index: 6;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 0;
        padding: 0;
        background: transparent;
        border: none;
      }
      .control-tabs {
        display: inline-flex;
        align-items: flex-end;
        gap: 4px;
        padding: 0;
        border-bottom: none;
        align-self: flex-start;
      }
      .tab-btn {
        background: rgba(255, 255, 255, 0.06);
        color: var(--text);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-bottom: none;
        box-shadow: none;
        border-radius: 10px 10px 0 0;
        padding: 5px 11px 6px 11px;
      }
      .tab-btn.active {
        background: rgba(8, 12, 24, 0.98);
        border-color: rgba(94, 208, 255, 0.55);
        color: #dff7ff;
        position: relative;
        top: 0;
        margin-bottom: -1px;
      }
      .control-status {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 14px;
        padding: 6px 2px 7px 2px;
        color: var(--muted);
        font-size: 12px;
        width: min(900px, calc(100vw - 56px));
        margin: 6px auto 0 auto;
      }
      .control-panel {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: center;
        padding: 9px 4px 2px 4px;
        min-height: 44px;
        width: min(900px, calc(100vw - 56px));
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 0 10px 10px 10px;
        background: rgba(8, 12, 24, 0.96);
      }
      .control-panel[hidden] {
        display: none;
      }
      .grid-controls input {
        min-width: 0;
        width: 70px;
        padding: 5px 7px;
        font-size: 12px;
      }
      .grid-controls select {
        min-width: 150px;
      }
      .turn-btn {
        background: linear-gradient(135deg, #f4c97a, #f2976a);
        color: #1a1010;
      }
      .turn-btn.ready {
        background: linear-gradient(135deg, #81eca2, #5ed0ff);
        box-shadow: 0 0 0 1px rgba(129, 236, 162, 0.55), 0 0 18px rgba(129, 236, 162, 0.28);
      }
      .grid-wrap {
        flex: 1 1 auto;
        background: rgba(8, 12, 24, 0.9);
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.05);
        overflow: hidden;
      }
      .overlay {
        position: absolute;
        z-index: 5;
        width: min(420px, 42vw);
        background: rgba(8, 12, 24, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 12px;
        backdrop-filter: blur(8px);
        box-shadow: var(--shadow);
        overflow: hidden;
      }
      .overlay > summary {
        cursor: pointer;
        list-style: none;
        padding: 8px 10px;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text);
        background: rgba(0, 0, 0, 0.16);
        border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      }
      .overlay > summary::-webkit-details-marker {
        display: none;
      }
      .overlay .panel-content {
        max-height: 42dvh;
        overflow: auto;
        padding: 10px;
      }
      .overlay-stack {
        position: absolute;
        top: 14px;
        right: 14px;
        z-index: 5;
        width: min(420px, 42vw);
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .overlay-stack .overlay {
        position: static;
        width: 100%;
      }
      #gridSvg {
        width: 100%;
        height: 100%;
        display: block;
      }
      #gridSvg text {
        font-size: 10px;
        fill: var(--muted);
        pointer-events: none;
      }
      .summary-section h3 {
        margin: 0 0 8px 0;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .summary-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 12px;
        color: var(--muted);
      }
      .mono {
        font-family: "JetBrains Mono", "Fira Code", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono",
          "Courier New", monospace;
        color: var(--text);
      }
      .status {
        font-size: 12px;
        color: var(--muted);
      }
      .init-modal {
        position: fixed;
        inset: 0;
        z-index: 20;
        background: rgba(3, 7, 14, 0.78);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }
      .init-modal[hidden] {
        display: none;
      }
      .init-card {
        width: min(520px, 96vw);
        background: linear-gradient(160deg, rgba(7, 11, 22, 0.96), rgba(12, 17, 31, 0.98));
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 14px;
        box-shadow: var(--shadow);
        padding: 14px;
      }
      .init-card h2 {
        margin: 0 0 6px 0;
        font-size: 18px;
      }
      .init-row {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }
      .init-row > * {
        flex: 1 1 auto;
      }
      a {
        color: var(--accent);
        text-decoration: none;
        font-size: 12px;
      }
      a:hover {
        text-decoration: underline;
      }
      @media (max-width: 980px) {
        .overlay {
          position: static;
          width: 100%;
          margin-top: 8px;
        }
        .overlay-stack {
          position: static;
          width: 100%;
          margin-top: 8px;
        }
        .grid-controls {
          bottom: 8px;
        }
        .overlay .panel-content {
          max-height: 28dvh;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="layout">
        <section class="panel grid-panel">
          <div class="grid-controls">
            <div class="control-tabs">
              <button class="tab-btn active" data-control-tab="turn">Turn</button>
              <button class="tab-btn" data-control-tab="view">View</button>
              <button class="tab-btn" data-control-tab="session">Session</button>
            </div>
            <div class="control-panel" data-control-panel="turn">
              <button id="stepBtn" class="turn-btn">End turn</button>
              <button id="holdBtn" class="secondary">Hold selected</button>
              <button id="runBtn" class="secondary">Auto</button>
              <input id="speedInput" type="number" min="100" step="100" value="900" />
            </div>
            <div class="control-panel" data-control-panel="view" hidden>
              <select id="viewMode">
                <option value="global">View: Global</option>
              </select>
            </div>
            <div class="control-panel" data-control-panel="session" hidden>
              <button id="newSimBtn" class="secondary">New sim</button>
              <button id="clearBtn" class="secondary">Clear log</button>
              <a href="./index.html">Back to systems</a>
            </div>
          </div>
          <div class="control-status">
            <div class="status" id="playerTeam">Player team: Team 0</div>
            <div class="status" id="status">Loading wasm…</div>
          </div>
          <div class="grid-wrap">
            <svg id="gridSvg"></svg>
          </div>

          <div class="overlay-stack">
            <details class="overlay" open>
              <summary>Intel</summary>
              <div class="panel-content summary">
                <div class="summary-section">
                  <h3>Units</h3>
                  <div class="summary-list" id="unitList"></div>
                </div>
                <div class="summary-section">
                  <h3>Loot</h3>
                  <div class="summary-list" id="lootList"></div>
                </div>
                <div class="summary-section">
                  <h3>Belief Peaks</h3>
                  <div class="summary-list" id="beliefList"></div>
                </div>
              </div>
            </details>

            <details class="overlay">
              <summary>Event Log</summary>
              <div class="panel-content log">
                <div class="log-list" id="logList"></div>
              </div>
            </details>
          </div>
        </section>
      </div>
    </div>

    <div class="init-modal" id="initModal">
      <div class="init-card">
        <h2>Start Simulation</h2>
        <p>Set a seed and start directly in play mode.</p>
        <div class="init-row">
          <input id="seedInput" type="text" placeholder="Seed (u64, optional)" />
          <button id="initBtn">Start sim</button>
        </div>
      </div>
    </div>

    <script type="module" src="./sim.ts"></script>
  </body>
</html>
